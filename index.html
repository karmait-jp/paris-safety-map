<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  .panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(255,255,255,0.95); border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    padding: 12px 14px; max-width: 340px; font-size: 12.5px; line-height: 1.55;
  }
  .panel h1 { font-size: 15px; margin: 0; cursor: pointer; user-select: none; display: flex; align-items: center; }
  .panel h1 .chev { margin-left: auto; padding-left: 8px; font-size: 11px; color: #666; transition: transform .2s; }
  .panel.closed .chev { transform: rotate(-90deg); }
  .panel.closed #panelbody { display: none; }
  #panelbody { margin-top: 4px; overflow-y: auto; max-height: calc(100vh - 120px); -webkit-overflow-scrolling: touch; }
  .panel .date { color: #666; font-size: 11px; margin-bottom: 6px; }
  .panel ul { margin: 4px 0; padding-left: 18px; }
  .panel li { margin-bottom: 3px; }
  .legend { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 6px; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .dot.red { background: rgba(211,47,47,0.6); border: 2px solid #d32f2f; }
  .dot.orange { background: rgba(245,124,0,0.5); border: 2px solid #f57c00; }
  .dot.purple { background: none; border: 2px dashed #7b1fa2; }
  .dot.news { background: rgba(194,24,91,0.25); border: 2px dashed #c2185b; }
  .dot.route { background: #5e35b1; border: 2px solid #5e35b1; }
  .zone-label { background: none; border: none; box-shadow: none; font-weight: 700; font-size: 11px; color: #333; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .leaflet-popup-content { font-size: 12.5px; line-height: 1.5; }
  .leaflet-popup-content b.rd { color: #c62828; }
  .leaflet-popup-content b.og { color: #e65100; }
  details summary { cursor: pointer; font-weight: 600; }
  .src { font-size: 10px; color: #888; margin-top: 6px; }
  .src a { color: #888; }
  .langs { font-size: 11px; margin-top: 6px; color: #888; }
  .langs a { color: #1565c0; text-decoration: none; margin-right: 6px; }
  .langs a.cur { color: #333; font-weight: 700; text-decoration: underline; }
  @media (max-width: 640px) {
    .panel { max-width: 88vw; font-size: 11.5px; }
    #panelbody { max-height: 52vh; }
  }
</style>
</head>

  <div class="langs" id="langsw"></div>
  </div>
</div>

  { ll: [48.8838, 2.3680], r: 400, dir: 'right',
    n: { ja: 'スターリングラード〜ジョレス', en: 'Stalingrad – Jaurès', fr: 'Stalingrad – Jaurès' },
    p: { ja: '<b class="og">メトロ高架下周辺。</b>夜間の雰囲気が悪く、スリ・薬物関連のトラブル報告あり。運河沿い散歩は日中に。',
         en: '<b class="og">Around the elevated metro.</b> Unpleasant at night; pickpocket and drug-related reports. Canal walks by daylight only.',
         fr: '<b class="og">Sous le métro aérien.</b> Ambiance désagréable la nuit ; vols et deal signalés. Balades le long du canal en journée uniquement.' } },
  { ll: [48.8834, 2.3277], r: 350,
    n: { ja: 'クリシー広場', en: 'Place de Clichy', fr: 'Place de Clichy' },
    p: { ja: '<b class="og">警視庁がデモ代替ルート起点として提案した場所。</b>今後のデモ出発点になる可能性あり。ピガール〜クリシーは夜間の客引きにも注意。',
         en: '<b class="og">Proposed by police HQ as an alternative march start</b> — may host future protests. Watch for touts between Pigalle and Clichy at night.',
         fr: '<b class="og">Proposée par la préfecture comme départ alternatif de cortèges.</b> Rabatteurs entre Pigalle et Clichy la nuit.' } },
  { ll: [48.9360, 2.3574], r: 1100,
    n: { ja: 'サン＝ドニ（市外北部）', en: 'Saint-Denis', fr: 'Saint-Denis' },
    p: { ja: '<b class="og">93県サン＝ドニ中心部。</b>今回の学生デモ発火点の高校があり騒乱が続く。平時から治安が悪く、<b>スタッド・ド・フランスのイベント時以外は夜間に行かない</b>。大聖堂観光は日中に。',
         en: '<b class="og">Central Saint-Denis (93).</b> Home to the school where the student movement began; unrest continues. Rough at all times — <b>don’t go at night except for Stade de France events</b>. Visit the basilica by day.',
         fr: '<b class="og">Centre de Saint-Denis (93).</b> Lycée à l’origine du mouvement ; troubles persistants. <b>Évitez la nuit hors événements au Stade de France.</b> Basilique à visiter en journée.' } },
];

const curfewZones = [
  { key: 'curfew1', ll: [48.8676, 2.3631], r: 750 },
  { key: 'curfew2', ll: [48.8619, 2.3469], r: 650 },
];

function addZones(zones, style) {
  zones.forEach(z => {
    L.circle(z.ll, { radius: z.r, ...style }).addTo(map)
      .bindPopup('<b>' + z.n[LANG] + '</b><br>' + z.p[LANG])
      .bindTooltip(z.n[LANG], { permanent: true, direction: z.dir || 'top', className: 'zone-label', offset: [0, -4] });
  });
}
addZones(redZones, RED);
addZones(orangeZones, ORG);
curfewZones.forEach(z => {
  L.circle(z.ll, { radius: z.r, ...CURFEW }).addTo(map).bindPopup('<b>' + S[z.key] + '</b>');
});

const parisTime = (iso) => new Date(iso).toLocaleString(LANG === 'ja' ? 'ja-JP' : LANG === 'fr' ? 'fr-FR' : 'en-GB',
  { timeZone: 'Europe/Paris', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

// デモの確定・予定ルート（routes.json: 手動キュレーション。過去日になると自動非表示）
const ROUTE_STYLE = { color: '#5e35b1', weight: 5, opacity: 0.85 };
fetch('routes.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d || !d.routes) return;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const act = d.routes.filter(rt => new Date(rt.date + 'T23:59:59') >= today);
    if (!act.length) return;
    const ul = document.getElementById('demolist');
    act.forEach(rt => {
      const li = document.createElement('li');
      li.innerHTML = '<b>' + rt.d[LANG] + ' ' + rt.t[LANG] + '</b> — ' + rt.label[LANG] +
        (rt.note ? '<br><span style="color:#666">' + rt.note[LANG] + '</span>' : '') +
        (rt.url ? ' <a href="' + rt.url + '" target="_blank" rel="noopener">🔗</a>' : '');
      ul.appendChild(li);
      if (rt.points && rt.points.length > 1) {
        const pop = '<b>📣 ' + rt.d[LANG] + ' ' + rt.t[LANG] + '</b><br>' + rt.label[LANG] +
          (rt.note ? '<br><span style="font-size:11px;color:#555">' + rt.note[LANG] + '</span>' : '');
        L.polyline(rt.points, ROUTE_STYLE).addTo(map).bindPopup(pop);
        const mk = (pt, txt) => L.circleMarker(pt, { radius: 6, color: '#5e35b1', fillColor: '#fff', fillOpacity: 1, weight: 3 })
          .addTo(map).bindPopup(pop)
          .bindTooltip(txt, { permanent: true, direction: 'right', className: 'zone-label', offset: [8, 0] });
        mk(rt.points[0], S.routestart + ' ' + rt.d[LANG]);
        mk(rt.points[rt.points.length - 1], S.routeend);
      }
    });
    document.getElementById('demobox').style.display = 'block';
  })
  .catch(() => {});

// ニュース自動検出ゾーン（paris-watchが報道中の地名からhotspots.jsonを自動生成・72hで失効）
fetch('hotspots.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d || !d.spots) return;
    const now = Date.now();
    d.spots.forEach(s => {
      if (now - new Date(s.last).getTime() > 72 * 3600 * 1000) return;
      const label = LANG === 'ja' ? s.label : (s.label_fr || s.label);
      const head = LANG === 'ja' ? s.head : (s.head_fr || s.head);
      const a = s.url ? '<br><a href="' + s.url + '" target="_blank" rel="noopener">' + (head || '🔗') + '</a>' : '';
      L.circle(s.ll, { radius: s.r, ...NEWSZ }).addTo(map)
        .bindPopup('<b>🗞 ' + label + '</b><br>' + S.hotspot(s.n, parisTime(s.last)) + a);
    });
  })
  .catch(() => {});

// 最新ニュース（paris-watchがnews.jsonを自動更新）
fetch('news.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d || !d.items || !d.items.length) return;
    const ul = document.getElementById('newslist');
    d.items.slice(0, 8).forEach(it => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = LANG === 'ja' ? it.ja : (it.fr || it.ja);
      li.appendChild(a);
      if (it.ts) {
        const s = document.createElement('span');
        s.textContent = ' (' + it.ts + ')';
        s.style.cssText = 'color:#999;font-size:10px';
        li.appendChild(s);
      }
      ul.appendChild(li);
    });
    document.getElementById('newsupd').textContent = S.newsupd(parisTime(d.updated));
    document.getElementById('newsbox').style.display = 'block';
  })
  .catch(() => {});
</script>
</body>
</html>
